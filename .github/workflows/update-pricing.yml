name: Update Model Pricing

on:
  schedule:
    - cron: "17 6 * * *"  # Daily at 06:17 UTC
  workflow_dispatch: {}

jobs:
  update-pricing:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Fetch latest pricing
        run: python fetch_pricing.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- pricing.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push pricing.json
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pricing.json
          git commit -m "Update model pricing from Anthropic docs"
          git push
